# LOCAL DEVELOPMENT ONLY.
# The passwords below are throwaway values for a database that only your own computer can reach.
# Do not use this file, or these passwords, for a real server. Production runs on Render (see render.yaml).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaphor_dev
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-local_dev_only_change_me}
      POSTGRES_DB: kaphor_db
    ports:
      - "127.0.0.1:5432:5432" # reachable from this computer only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaphor_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379" # reachable from this computer only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./kaphor/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - ./kaphor/backend/.env
    environment:
      DATABASE_URL: postgresql://kaphor_dev:${LOCAL_DB_PASSWORD:-local_dev_only_change_me}@postgres:5432/kaphor_db
      REDIS_URL: redis://redis:6379
      # Local run: keep development mode so the production-only config checks do not block you.
      NODE_ENV: development
      PORT: "4000"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
